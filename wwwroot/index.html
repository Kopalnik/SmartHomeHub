<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Dashboard</title>

    <!-- Loads dashboard styles and JavaScript functionality. -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Dashboard header and application description. -->
    <header class="header">
        <h1>Smart Home Dashboard</h1>
        <p>Real-time device monitoring system</p>
    </header>

    <main class="container">

        <!-- Summary section displaying device statistics. -->
        <section class="summary">

            <!-- Total number of monitored devices. -->
            <div class="summary-card total">
                <h2>Total Devices</h2>
                <span id="total-devices">0</span>
            </div>

            <!-- Number of currently online devices. -->
            <div class="summary-card online">
                <h2>Online Devices</h2>
                <span id="online-devices">0</span>
            </div>

            <!-- Number of currently offline devices. -->
            <div class="summary-card offline">
                <h2>Offline Devices</h2>
                <span id="offline-devices">0</span>
            </div>

        </section>

        <!-- Main device monitoring section. -->
        <section class="devices-section">

            <!-- Section heading and manual refresh button. -->
            <div class="section-header">
                <h2>Device Monitoring</h2>
                <button id="refresh-button">Refresh</button>
            </div>

            <!-- Displays the time of the last data update. -->
            <p id="last-updated">Waiting for data...</p>

            <!-- Displays API communication errors. -->
            <p id="error-message" role="alert"></p>

            <!-- Container for dynamically generated device cards. -->
            <div id="devices-container" class="devices-grid">
                <p>Loading devices...</p>
            </div>

        </section>

    </main>

    <!-- Project and IT Camp information. -->
    <footer>
        <p>Smart Home Hub | IT Camp 2026</p>
    </footer>

</body>
</html>
